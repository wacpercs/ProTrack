<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProTrack AI — Выбери свой путь</title>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: #000;
            color: #0f0;
            font-family: 'Courier New', monospace;
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* === MATRIX RAIN === */
        canvas#matrixRain {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
        }

        /* === MAIN CONTENT === */
        .choice-container {
            position: relative;
            z-index: 10;
            text-align: center;
            animation: fadeInUp 1.5s ease forwards;
            opacity: 0;
            padding: 20px;
        }

        .morpheus-text {
            font-size: clamp(14px, 2.5vw, 20px);
            color: #8a8a8a;
            margin-bottom: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0;
            animation: typeIn 0.8s ease 0.5s forwards;
        }

        .title {
            font-size: clamp(32px, 7vw, 64px);
            font-weight: bold;
            color: #fff;
            margin-bottom: 8px;
            text-shadow: 0 0 30px rgba(255,255,255,0.15);
            opacity: 0;
            animation: typeIn 0.8s ease 0.8s forwards;
        }

        .subtitle {
            font-size: clamp(12px, 2vw, 16px);
            color: #555;
            margin-bottom: 50px;
            letter-spacing: 3px;
            text-transform: uppercase;
            opacity: 0;
            animation: typeIn 0.8s ease 1.1s forwards;
        }

        .pills {
            display: flex;
            gap: clamp(30px, 6vw, 80px);
            justify-content: center;
            align-items: center;
            opacity: 0;
            animation: pillsAppear 1s ease 1.6s forwards;
        }

        /* === PILL === */
        .pill {
            position: relative;
            cursor: pointer;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            -webkit-tap-highlight-color: transparent;
        }
        .pill:hover {
            transform: scale(1.12);
        }
        .pill:active {
            transform: scale(0.95);
        }

        .pill-shape {
            width: clamp(80px, 16vw, 140px);
            height: clamp(40px, 8vw, 65px);
            border-radius: 100px;
            position: relative;
            overflow: hidden;
            box-shadow:
                0 4px 20px rgba(0,0,0,0.5),
                inset 0 -3px 8px rgba(0,0,0,0.3),
                inset 0 3px 8px rgba(255,255,255,0.1);
            transition: box-shadow 0.4s;
        }

        /* Split pill halves */
        .pill-shape::before,
        .pill-shape::after {
            content: '';
            position: absolute;
            top: 0;
            width: 50%;
            height: 100%;
        }
        .pill-shape::before { left: 0; }
        .pill-shape::after { right: 0; }

        /* Capsule seam */
        .pill-seam {
            position: absolute;
            top: 5%; bottom: 5%;
            left: 50%;
            width: 2px;
            transform: translateX(-50%);
            z-index: 2;
        }

        /* Shine */
        .pill-shine {
            position: absolute;
            top: 8px;
            left: 15%;
            width: 55%;
            height: 30%;
            border-radius: 50%;
            z-index: 3;
            pointer-events: none;
        }

        /* RED pill */
        .pill-red .pill-shape::before {
            background: linear-gradient(180deg, #ff4060 0%, #cc1035 50%, #8a0020 100%);
        }
        .pill-red .pill-shape::after {
            background: linear-gradient(180deg, #e03050 0%, #a00825 50%, #700018 100%);
        }
        .pill-red .pill-seam { background: rgba(80, 0, 10, 0.6); }
        .pill-red .pill-shine { background: radial-gradient(ellipse, rgba(255,200,200,0.5) 0%, transparent 70%); }
        .pill-red:hover .pill-shape {
            box-shadow:
                0 4px 20px rgba(0,0,0,0.5),
                0 0 40px rgba(255, 45, 111, 0.5),
                0 0 80px rgba(255, 45, 111, 0.2),
                inset 0 -3px 8px rgba(0,0,0,0.3),
                inset 0 3px 8px rgba(255,255,255,0.1);
        }

        /* GREEN pill */
        .pill-green .pill-shape::before {
            background: linear-gradient(180deg, #00e85a 0%, #00a83a 50%, #006820 100%);
        }
        .pill-green .pill-shape::after {
            background: linear-gradient(180deg, #00d050 0%, #009030 50%, #005818 100%);
        }
        .pill-green .pill-seam { background: rgba(0, 50, 10, 0.6); }
        .pill-green .pill-shine { background: radial-gradient(ellipse, rgba(200,255,200,0.5) 0%, transparent 70%); }
        .pill-green:hover .pill-shape {
            box-shadow:
                0 4px 20px rgba(0,0,0,0.5),
                0 0 40px rgba(0, 200, 83, 0.5),
                0 0 80px rgba(0, 200, 83, 0.2),
                inset 0 -3px 8px rgba(0,0,0,0.3),
                inset 0 3px 8px rgba(255,255,255,0.1);
        }

        .pill-label {
            margin-top: 20px;
            font-size: clamp(11px, 1.8vw, 14px);
            letter-spacing: 3px;
            text-transform: uppercase;
            transition: color 0.3s, text-shadow 0.3s;
        }
        .pill-red .pill-label {
            color: #663040;
        }
        .pill-red:hover .pill-label {
            color: #ff2d6f;
            text-shadow: 0 0 12px rgba(255, 45, 111, 0.5);
        }
        .pill-green .pill-label {
            color: #306640;
        }
        .pill-green:hover .pill-label {
            color: #00c853;
            text-shadow: 0 0 12px rgba(0, 200, 83, 0.5);
        }

        /* === OR DIVIDER === */
        .or-divider {
            color: #333;
            font-size: clamp(10px, 1.5vw, 13px);
            letter-spacing: 4px;
            align-self: center;
            text-transform: uppercase;
            user-select: none;
        }

        /* === TRANSITION OVERLAY === */
        .transition-overlay {
            position: fixed;
            inset: 0;
            z-index: 9999;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.6s ease;
        }
        .transition-overlay.active {
            opacity: 1;
            pointer-events: all;
        }
        .transition-overlay.red { background: radial-gradient(ellipse at center, #1a0008, #000); }
        .transition-overlay.green { background: radial-gradient(ellipse at center, #001a08, #000); }

        /* === FLOATING PILL REFLECTIONS === */
        .pill-float {
            animation: pillFloat 3s ease-in-out infinite;
        }
        .pill-float-delay {
            animation: pillFloat 3s ease-in-out 0.3s infinite;
        }

        /* === ANIMATIONS === */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes typeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes pillsAppear {
            from { opacity: 0; transform: scale(0.8); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes pillFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        /* === MOBILE === */
        @media (max-width: 480px) {
            .pills { gap: 24px; }
        }
    </style>
</head>
<body>
    <canvas id="matrixRain"></canvas>

    <div class="choice-container">
        <div class="morpheus-text">ProTrack AI</div>
        <div class="title">Выбери свой путь</div>
        <div class="subtitle">Обратной дороги нет</div>

        <div class="pills">
            <div class="pill pill-red pill-float" onclick="choosePill('red')">
                <div class="pill-shape">
                    <div class="pill-seam"></div>
                    <div class="pill-shine"></div>
                </div>
                <div class="pill-label">Emo</div>
            </div>

            <div class="or-divider">или</div>

            <div class="pill pill-green pill-float-delay" onclick="choosePill('green')">
                <div class="pill-shape">
                    <div class="pill-seam"></div>
                    <div class="pill-shine"></div>
                </div>
                <div class="pill-label">Breaking Bad</div>
            </div>
        </div>
    </div>

    <div class="transition-overlay" id="transOverlay"></div>

    <script>
    // === MATRIX RAIN ===
    (function() {
        const canvas = document.getElementById('matrixRain');
        const ctx = canvas.getContext('2d');
        let w, h, columns, drops;

        const chars = 'アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホマミムメモヤユヨラリルレロワヲン0123456789PROTRACK';

        function resize() {
            w = canvas.width = window.innerWidth;
            h = canvas.height = window.innerHeight;
            const fontSize = 14;
            columns = Math.floor(w / fontSize);
            drops = new Array(columns).fill(1).map(() => Math.random() * -100);
        }

        resize();
        window.addEventListener('resize', resize);

        function draw() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.06)';
            ctx.fillRect(0, 0, w, h);
            ctx.fillStyle = '#003800';
            ctx.font = '14px monospace';

            for (let i = 0; i < drops.length; i++) {
                const char = chars[Math.floor(Math.random() * chars.length)];
                const x = i * 14;
                const y = drops[i] * 14;

                // Brighter at the head
                if (Math.random() > 0.95) {
                    ctx.fillStyle = '#00ff41';
                } else {
                    ctx.fillStyle = 'rgba(0, 56, 0, 0.8)';
                }

                ctx.fillText(char, x, y);

                if (y > h && Math.random() > 0.975) {
                    drops[i] = 0;
                }
                drops[i]++;
            }
            requestAnimationFrame(draw);
        }
        draw();
    })();

    // === PILL CHOICE ===
    function choosePill(color) {
        const overlay = document.getElementById('transOverlay');
        overlay.className = 'transition-overlay ' + (color === 'red' ? 'red' : 'green') + ' active';

        const target = color === 'red' ? 'emo.html' : 'breaking.html';

        setTimeout(function() {
            window.location.href = target;
        }, 700);
    }
    </script>
</body>
</html>
